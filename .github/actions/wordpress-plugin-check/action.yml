name: WordPress Plugin Check
description: Install WordPress, install the Plugin Check plugin, and run checks against a built plugin directory.

inputs:
  plugin-slug:
    description: WordPress plugin slug to install and check.
    default: jeowp
  plugin-build-dir:
    description: Built plugin directory to copy into the WordPress installation.
    required: true
  results-path:
    description: Path where the JSON Plugin Check output should be written.
    required: true
  wp-path:
    description: WordPress installation path.
    default: /tmp/wordpress
  wp-version:
    description: WordPress version to install.
    default: latest
  wp-url:
    description: Local WordPress site URL.
    default: http://localhost:8880
  db-name:
    description: WordPress database name.
    default: wordpress
  db-user:
    description: WordPress database user.
    default: root
  db-pass:
    description: WordPress database password.
    default: root
  db-host:
    description: WordPress database host.
    default: 127.0.0.1:3306
  fail-on-warnings:
    description: Whether to fail the check when warnings are found (not just errors).
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install WordPress and Plugin Check
      shell: bash
      env:
        DB_HOST: ${{ inputs.db-host }}
        DB_NAME: ${{ inputs.db-name }}
        DB_PASS: ${{ inputs.db-pass }}
        DB_USER: ${{ inputs.db-user }}
        PLUGIN_BUILD_DIR: ${{ inputs.plugin-build-dir }}
        PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        WP_PATH: ${{ inputs.wp-path }}
        WP_URL: ${{ inputs.wp-url }}
        WP_VERSION: ${{ inputs.wp-version }}
      run: |
        set -euo pipefail

        rm -rf "$WP_PATH"

        wp core download --path="$WP_PATH" --version="$WP_VERSION" --force
        wp config create \
          --path="$WP_PATH" \
          --dbname="$DB_NAME" \
          --dbuser="$DB_USER" \
          --dbpass="$DB_PASS" \
          --dbhost="$DB_HOST" \
          --skip-check \
          --force
        wp core install \
          --path="$WP_PATH" \
          --url="$WP_URL" \
          --title="Plugin Check" \
          --admin_user=admin \
          --admin_password=password \
          --admin_email=admin@example.com \
          --skip-email
        wp plugin install \
          --path="$WP_PATH" \
          https://downloads.wordpress.org/plugin/plugin-check.zip \
          --activate

        rm -rf "$WP_PATH/wp-content/plugins/$PLUGIN_SLUG"
        mkdir -p "$WP_PATH/wp-content/plugins/$PLUGIN_SLUG"
        rsync -a --delete "$PLUGIN_BUILD_DIR/" "$WP_PATH/wp-content/plugins/$PLUGIN_SLUG/"

    - name: Run WordPress Plugin Check
      shell: bash
      env:
        FAIL_ON_WARNINGS: ${{ inputs.fail-on-warnings }}
        PLUGIN_CHECK_RESULTS: ${{ inputs.results-path }}
        PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        WP_PATH: ${{ inputs.wp-path }}
      run: |
        set -euo pipefail

        echo "::group::Debugging information"
        wp --path="$WP_PATH" cli info
        wp --path="$WP_PATH" plugin list
        wp --path="$WP_PATH" --require="$WP_PATH/wp-content/plugins/plugin-check/cli.php" plugin list-checks
        wp --path="$WP_PATH" --require="$WP_PATH/wp-content/plugins/plugin-check/cli.php" plugin list-check-categories
        echo "::endgroup::"

        echo "::group::Install dependencies"
        DEPENDENCIES_RAW=$(wp --path="$WP_PATH" plugin get "$PLUGIN_SLUG" --field=requires_plugins | tr ',' ' ' | xargs || true)

        if [ -z "$DEPENDENCIES_RAW" ]; then
          echo "Plugin has no dependencies"
        else
          read -r -a DEPENDENCIES <<< "$DEPENDENCIES_RAW"
          echo "Installing plugin dependencies: $DEPENDENCIES_RAW"
          wp --path="$WP_PATH" plugin install --activate "${DEPENDENCIES[@]}"
        fi
        echo "::endgroup::"

        wp --path="$WP_PATH" plugin activate "$PLUGIN_SLUG"

        # NOTE: wp plugin check never returns a non-zero exit code when errors or
        # warnings are found — it only exits non-zero on runner/CLI failures.
        # We therefore use strict-json (a single valid JSON array) and parse the
        # results ourselves to determine pass/fail.
        echo "::group::Run Plugin Check"
        set +e
        wp --path="$WP_PATH" \
          --require="$WP_PATH/wp-content/plugins/plugin-check/cli.php" \
          plugin check "$PLUGIN_SLUG" \
          --format=strict-json \
          --slug="$PLUGIN_SLUG" \
          --exclude-files=.wp-env.json \
          > "$PLUGIN_CHECK_RESULTS"
        cli_status=$?
        set -e

        cat "$PLUGIN_CHECK_RESULTS"
        echo
        echo "::endgroup::"

        # Fail immediately if the wp CLI command itself crashed.
        if [ "$cli_status" -ne 0 ]; then
          echo "::error::Plugin Check command failed with exit code $cli_status"
          exit 1
        fi

        # Parse the JSON results with jq.
        ERROR_COUNT=$(jq '[.[] | select(.type == "ERROR")] | length' "$PLUGIN_CHECK_RESULTS")
        WARNING_COUNT=$(jq '[.[] | select(.type == "WARNING")] | length' "$PLUGIN_CHECK_RESULTS")

        echo "Plugin Check results: $ERROR_COUNT error(s), $WARNING_COUNT warning(s)."

        # Emit GitHub Actions annotations for visibility.
        if [ "$ERROR_COUNT" -gt 0 ]; then
          jq -r '.[] | select(.type == "ERROR") | "::error file=\(.file // ""),line=\(.line // 1)::[\(.code)] \(.message)"' \
            "$PLUGIN_CHECK_RESULTS"
        fi
        if [ "$WARNING_COUNT" -gt 0 ]; then
          jq -r '.[] | select(.type == "WARNING") | "::warning file=\(.file // ""),line=\(.line // 1)::[\(.code)] \(.message)"' \
            "$PLUGIN_CHECK_RESULTS"
        fi

        # Errors always fail.
        if [ "$ERROR_COUNT" -gt 0 ]; then
          echo "::error::Plugin Check found $ERROR_COUNT error(s)."
          exit 1
        fi

        # Warnings fail only when explicitly requested.
        if [ "$FAIL_ON_WARNINGS" = "true" ] && [ "$WARNING_COUNT" -gt 0 ]; then
          echo "::error::Plugin Check found $WARNING_COUNT warning(s) and fail-on-warnings is enabled."
          exit 1
        fi

        echo "Plugin Check passed."
        exit 0
