name: Sync Docs Site

on:
  push:
    branches:
      - master
    paths:
      - docs/**
      - site-novo/www/**
      - package.json
      - .github/workflows/docs-site.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-site:
    name: Build and sync site/
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            site-novo/www/package-lock.json

      - name: Build site (landing + docs)
        run: npm run build:site

      - name: Commit generated site
        run: |
          if [ -z "$(git status --porcelain -- site)" ]; then
            echo "site/ is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          git commit -m "docs: sync generated site"
          git push
