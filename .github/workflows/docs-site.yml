name: Documentation Site

on:
  pull_request:
    branches:
      - feature/experimental
      - develop
      - master
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - site-novo/**
      - .github/workflows/docs-site.yml
  push:
    branches:
      - master
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - site-novo/**
      - .github/workflows/docs-site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: ${{ hashFiles('site-novo/www/package-lock.json') != '' }}
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site-novo/www/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Build landing page
        if: ${{ hashFiles('site-novo/www/package-lock.json') != '' }}
        run: |
          npm ci --prefix site-novo/www
          npm run build --prefix site-novo/www

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      - name: Build MkDocs site
        run: python -m mkdocs build --clean

  deploy:
    name: Deploy documentation site
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: ${{ hashFiles('site-novo/www/package-lock.json') != '' }}
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site-novo/www/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Build landing page
        if: ${{ hashFiles('site-novo/www/package-lock.json') != '' }}
        run: |
          npm ci --prefix site-novo/www
          npm run build --prefix site-novo/www

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      - name: Build MkDocs site
        run: python -m mkdocs build --clean

      - name: Deploy to gh-pages
        env:
          DEPLOY_BRANCH: gh-pages
          DEPLOY_DIR: ${{ runner.temp }}/gh-pages
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${DEPLOY_BRANCH}"
          git worktree add --detach "${DEPLOY_DIR}" FETCH_HEAD

          cname_file="$(mktemp)"
          if [[ -f "${DEPLOY_DIR}/CNAME" ]]; then
            cp "${DEPLOY_DIR}/CNAME" "${cname_file}"
          else
            printf 'jeowp.org\n' > "${cname_file}"
          fi

          if [[ -d site-novo/www/dist ]]; then
            find "${DEPLOY_DIR}" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a site-novo/www/dist/. "${DEPLOY_DIR}/"
          else
            echo "site-novo/www is not present; preserving the existing gh-pages root."
          fi

          rm -rf "${DEPLOY_DIR}/docs"
          mkdir -p "${DEPLOY_DIR}/docs"
          cp -a .build/mkdocs/. "${DEPLOY_DIR}/docs/"

          touch "${DEPLOY_DIR}/.nojekyll"
          cp "${cname_file}" "${DEPLOY_DIR}/CNAME"

          cd "${DEPLOY_DIR}"
          git add -A

          if git diff --cached --quiet; then
            echo "gh-pages is already up to date."
            exit 0
          fi

          git commit -m "docs: deploy site from ${GITHUB_SHA}"
          git push origin "HEAD:${DEPLOY_BRANCH}"
