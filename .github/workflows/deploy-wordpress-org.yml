name: Release
on:
  push:
    tags:
    - "*.*.*"
    - "!*-*"

permissions:
  contents: write
jobs:
  tag:
    name: Stable tag release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        coverage: none
        tools: wp-cli
    - name: Install frontend dependencies
      run: |
        npm ci
    - name: Validate release metadata
      run: node scripts/validate-release-meta.mjs
    - name: Validate frontend build and tests
      run: |
        npm run test:unit
        npm run build:release
        npm run build:report
    - name: Prepare Plugin Check build
      run: |
        rm -rf "${RUNNER_TEMP}/plugin-check-build"
        mkdir -p "${RUNNER_TEMP}/plugin-check-build/jeo"
        rsync -a --delete src/ "${RUNNER_TEMP}/plugin-check-build/jeo/"
    - name: Run WordPress Plugin Check
      uses: wordpress/plugin-check-action@v1
      with:
        build-dir: ${{ runner.temp }}/plugin-check-build/jeo
        slug: jeo
        include-experimental: false
    - name: Build GitHub release zip
      run: |
        rm -rf "${RUNNER_TEMP}/github-release"
        mkdir -p "${RUNNER_TEMP}/github-release/jeo"
        rsync -a --delete src/ "${RUNNER_TEMP}/github-release/jeo/"
        cd "${RUNNER_TEMP}/github-release"
        zip -qr "${RUNNER_TEMP}/jeo.zip" jeo
    - name: Publish GitHub release
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ runner.temp }}/jeo.zip
        generate_release_notes: true
    - name: WordPress Plugin Deploy
      if: vars.WPORG_DEPLOY_ENABLED == 'true'
      uses: 10up/action-wordpress-plugin-deploy@stable
      with:
        generate-zip: false
      env:
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        SLUG: jeo # optional, remove if GitHub repo name matches SVN slug, including capitalization
        BUILD_DIR: src
        ASSETS_DIR: .wordpress-org
