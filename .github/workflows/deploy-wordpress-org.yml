name: Release
on:
  push:
    tags:
    - "*.*.*"
    - "!*-*"

permissions:
  contents: write
jobs:
  tag:
    name: Stable tag release
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_PATH: /tmp/wordpress
      PLUGIN_BUILD_DIR: /tmp/plugin-check-build/jeowp
      PLUGIN_CHECK_RESULTS: /tmp/plugin-check-results.txt
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        coverage: none
        extensions: mysqli
        tools: wp-cli
    - name: Install frontend dependencies
      run: |
        npm ci
    - name: Validate release metadata
      run: node scripts/validate-release-meta.mjs
    - name: Validate frontend build and tests
      run: |
        npm run test:unit
        npm run build:release
        npm run build:report
    - name: Prepare Plugin Check build
      run: |
        rm -rf "${RUNNER_TEMP}/plugin-check-build"
        mkdir -p "$PLUGIN_BUILD_DIR"
        rsync -a --delete src/ "$PLUGIN_BUILD_DIR/"
    - name: Run WordPress Plugin Check
      uses: ./.github/actions/wordpress-plugin-check
      with:
        plugin-build-dir: ${{ env.PLUGIN_BUILD_DIR }}
        results-path: ${{ env.PLUGIN_CHECK_RESULTS }}
        wp-path: ${{ env.WP_PATH }}
    - name: Upload Plugin Check results
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: plugin-check-results-jeowp
        path: ${{ env.PLUGIN_CHECK_RESULTS }}
        if-no-files-found: ignore
    - name: Build GitHub release zip
      run: |
        rm -rf "${RUNNER_TEMP}/github-release"
        mkdir -p "${RUNNER_TEMP}/github-release/jeowp"
        rsync -a --delete src/ "${RUNNER_TEMP}/github-release/jeowp/"
        cd "${RUNNER_TEMP}/github-release"
        zip -qr "${RUNNER_TEMP}/jeowp.zip" jeowp
    - name: Publish GitHub release
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ runner.temp }}/jeowp.zip
        generate_release_notes: true
    - name: WordPress Plugin Deploy
      if: vars.WPORG_DEPLOY_ENABLED == 'true'
      uses: 10up/action-wordpress-plugin-deploy@stable
      with:
        generate-zip: false
      env:
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        SLUG: jeowp # optional, remove if GitHub repo name matches SVN slug, including capitalization
        BUILD_DIR: src
        ASSETS_DIR: .wordpress-org
