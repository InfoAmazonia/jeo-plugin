name: WordPress Smoke Tests

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build-smoke-assets:
    name: Build smoke test assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build plugin assets
        run: npm run build:assets

      - name: Upload smoke test assets
        uses: actions/upload-artifact@v7
        with:
          name: wordpress-smoke-assets
          path: src/js/build
          if-no-files-found: error
          retention-days: 1

  wordpress-smoke:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: build-smoke-assets
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            wordpress: '6.6'
            label: WordPress 6.6 on PHP 8.0 (backward-compat, non-blocking)
            experimental: true
          - php: '8.1'
            wordpress: '6.6'
            label: WordPress 6.6 on PHP 8.1 (backward-compat, non-blocking)
            experimental: true
          - php: '8.2'
            wordpress: '7.0'
            label: WordPress 7.0 on PHP 8.2
            experimental: false
          - php: '8.3'
            wordpress: '7.0'
            label: WordPress 7.0 on PHP 8.3
            experimental: false
          - php: '8.4'
            wordpress: '7.0'
            label: WordPress 7.0 on PHP 8.4
            experimental: false
          - php: '8.5'
            wordpress: '7.0'
            label: WordPress 7.0 on PHP 8.5 (experimental, non-blocking)
            experimental: true

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v6

      - name: Download smoke test assets
        uses: actions/download-artifact@v7
        with:
          name: wordpress-smoke-assets
          path: src/js/build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli
          tools: wp-cli

      - name: Show PHP version
        run: php -v

      - name: Wait for MariaDB
        env:
          WP_DB_HOST: 127.0.0.1
          WP_DB_NAME: wordpress
          WP_DB_USER: wordpress
          WP_DB_PASSWORD: wordpress
        run: |
          php -r '
          $host = getenv("WP_DB_HOST");
          $name = getenv("WP_DB_NAME");
          $user = getenv("WP_DB_USER");
          $password = getenv("WP_DB_PASSWORD");
          for ( $attempt = 1; $attempt <= 30; $attempt++ ) {
              $mysqli = @mysqli_connect($host, $user, $password, $name, 3306);
              if ( false !== $mysqli ) {
                  mysqli_close($mysqli);
                  exit(0);
              }
              sleep(2);
          }
          fwrite(STDERR, "Timed out waiting for MariaDB.\n");
          exit(1);
          '

      - name: Run WordPress smoke test
        env:
          WP_DIR: ${{ runner.temp }}/wordpress
          WP_VERSION: ${{ matrix.wordpress }}
          WP_SITE_URL: http://127.0.0.1
          WP_DB_HOST: 127.0.0.1:3306
          WP_DB_NAME: wordpress
          WP_DB_USER: wordpress
          WP_DB_PASSWORD: wordpress
        run: bash scripts/wordpress-smoke.sh
