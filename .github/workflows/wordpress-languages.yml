name: WordPress Language Files

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wordpress-language-files:
    name: Validate WordPress language files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup WP-CLI
        uses: holyhope/install-wp-cli-github-action@main
        with:
          version: 'latest'

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Test WordPress language files
        id: language-files
        continue-on-error: true
        uses: holyhope/test-wordpress-languages-github-action@v4.0.2
        with:
          slug: jeo
          source: src
          pot_file: src/languages/jeo.pot
          domain: jeo
          exclude: js/src
          fail_on_diff: false
          fail_on_warning: false

      - name: Upload language file patch
        if: always() && steps.language-files.outputs.patch_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: wordpress-language-files-patch
          path: ${{ steps.language-files.outputs.patch_path }}
          if-no-files-found: ignore

      - name: Upload language file warnings
        if: always() && steps.language-files.outputs.warnings_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: wordpress-language-files-warnings
          path: ${{ steps.language-files.outputs.warnings_path }}
          if-no-files-found: ignore

      - name: Validate language file results
        if: always()
        shell: bash
        env:
          ACTION_OUTCOME: ${{ steps.language-files.outcome }}
          PATCH_PATH: ${{ steps.language-files.outputs.patch_path }}
          WARNINGS_PATH: ${{ steps.language-files.outputs.warnings_path }}
        run: |
          set -euo pipefail

          if [[ -n "${WARNINGS_PATH}" && -s "${WARNINGS_PATH}" ]]; then
            echo "::group::Language file warnings"
            cat "${WARNINGS_PATH}"
            echo "::endgroup::"
            echo "::error::WordPress language file generation produced warnings."
            exit 1
          fi

          if [[ -z "${PATCH_PATH}" ]]; then
            if [[ "${ACTION_OUTCOME}" != "success" ]]; then
              echo "::error::WordPress language file validation failed before producing a patch."
              exit 1
            fi

            echo "No language file patch was generated."
            exit 0
          fi

          if [[ ! -f "${PATCH_PATH}" ]]; then
            echo "::error::WordPress language file validation did not produce the expected patch file."
            exit 1
          fi

          if [[ ! -s "${PATCH_PATH}" ]]; then
            echo "WordPress language files are up to date."
            exit 0
          fi

          changed_lines="$(mktemp)"
          awk '
            /^(\+\+\+|---) / { next }
            /^[+-]/ {
              line = substr($0, 2)
              if (line ~ /# Copyright \(C\)/) next
              if (line ~ /"POT-Creation-Date:/) next
              if (line ~ /X-Generator:/) next
              print
            }
          ' "${PATCH_PATH}" > "${changed_lines}"

          if [[ -s "${changed_lines}" ]]; then
            echo "::group::Language file changes"
            cat "${PATCH_PATH}"
            echo "::endgroup::"
            echo "::error::WordPress language files are out of date. Apply the uploaded wordpress-language-files-patch artifact and commit the result."
            exit 1
          fi

          echo "Only ignored language file metadata changed."
